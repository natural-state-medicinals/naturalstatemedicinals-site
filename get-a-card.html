off-white, warm paper */\n  --ns-midnight:  #20253A; /* deep navy, primary ink */\n  --ns-bronze:    #B79550; /* signature gold/bronze */\n\n  /* PALETTE — accent */\n  --ns-cream:     #F6E7D7; /* warm peach-cream */\n  --ns-haze:      #EFD7C5; /* dusty pink-tan */\n\n  /* Extended neutrals (derived; for borders, hairlines, hover states) */\n  --ns-midnight-90: #2c3149;\n  --ns-midnight-70: #4a4f63;\n  --ns-midnight-50: #8b8e9c;\n  --ns-midnight-20: #d2d3d8;\n  --ns-bronze-dark: #8e7339; /* hover state on bronze CTAs */\n  --ns-bronze-light: #d4b878;\n  --ns-arctic-deep: #ebe9d0; /* subtle paper shadow */\n  --ns-ink-on-cream: #20253A;\n\n  /* Semantic / functional */\n  --ns-success: #5a7d4a;\n  --ns-warning: #c08a3e;\n  --ns-error:   #9b3838;\n\n  /* ===========================================================\n     SURFACE / FOREGROUND TOKENS (use these in product code)\n     =========================================================== */\n  --bg-primary:     var(--ns-arctic);\n  --bg-secondary:   var(--ns-cream);\n  --bg-tertiary:    var(--ns-haze);\n  --bg-inverse:     var(--ns-midnight);\n  --bg-elevated:    #ffffff;\n\n  --fg-primary:     var(--ns-midnight);\n  --fg-secondary:   var(--ns-midnight-70);\n  --fg-tertiary:    var(--ns-midnight-50);\n  --fg-inverse:     var(--ns-arctic);\n  --fg-accent:      var(--ns-bronze);\n\n  --border-hairline: rgba(32, 37, 58, 0.12);\n  --border-default:  rgba(32, 37, 58, 0.22);\n  --border-strong:   var(--ns-midnight);\n  --border-bronze:   var(--ns-bronze);\n\n  /* ===========================================================\n     TYPOGRAPHY — base families\n     ===========================================================\n     - display: ornate slab serif used for arched marks, big numbers\n     - heading: classical serif for H1–H3\n     - sans:    geometric sans for eyebrows, labels, UI\n     - body:    serif for long-form copy\n  */\n  --font-display:         'Burford', 'Playfair Display', Georgia, serif;\n  --font-display-outline: 'Burford Outline', 'Burford', Georgia, serif;\n  --font-display-line:    'Burford Line', 'Burford', Georgia, serif;\n  --font-display-rustic:  'Burford Rustic', 'Burford', Georgia, serif;\n  --font-heading:         'Esther', 'Cormorant Garamond', Georgia, serif;\n  --font-sans:            'Caligor Sans', 'Outfit', 'Futura', system-ui, sans-serif;\n  --font-sans-edge:       'Caligor Sans Edge', 'Caligor Sans', system-ui, sans-serif;\n  --font-serif-sans:      'Caligor', 'Outfit', system-ui, sans-serif;\n  --font-body:            'Esther', 'Cormorant Garamond', Georgia, serif;\n  --font-mono:            ui-monospace, 'SF Mono', Menlo, monospace;\n\n  /* Weight scale */\n  --fw-light:    300;\n  --fw-regular:  400;\n  --fw-medium:   500;\n  --fw-semibold: 600;\n  --fw-bold:     700;\n\n  /* Type scale (modular, ratio ~1.25) */\n  --fs-xs:    12px;\n  --fs-sm:    14px;\n  --fs-base:  16px;\n  --fs-md:    18px;\n  --fs-lg:    22px;\n  --fs-xl:    28px;\n  --fs-2xl:   36px;\n  --fs-3xl:   48px;\n  --fs-4xl:   64px;\n  --fs-5xl:   88px;\n  --fs-6xl:   120px;\n\n  /* Line heights */\n  --lh-tight:   1.05;\n  --lh-snug:    1.2;\n  --lh-base:    1.5;\n  --lh-relaxed: 1.65;\n\n  /* Letter spacing — eyebrows + display caps want generous tracking */\n  --ls-tight:   -0.01em;\n  --ls-normal:  0;\n  --ls-wide:    0.08em;\n  --ls-wider:   0.18em;   /* eyebrow / label all-caps */\n  --ls-widest:  0.32em;   /* display arched headers */\n\n  /* ===========================================================\n     SPACING — 4px base\n     =========================================================== */\n  --sp-0:  0;\n  --sp-1:  4px;\n  --sp-2:  8px;\n  --sp-3:  12px;\n  --sp-4:  16px;\n  --sp-5:  20px;\n  --sp-6:  24px;\n  --sp-8:  32px;\n  --sp-10: 40px;\n  --sp-12: 48px;\n  --sp-16: 64px;\n  --sp-20: 80px;\n  --sp-24: 96px;\n  --sp-32: 128px;\n\n  /* Radii — restrained. Brand artwork is square-cornered slab-serif. */\n  --r-none: 0;\n  --r-xs:   2px;\n  --r-sm:   4px;\n  --r-md:   6px;\n  --r-lg:   10px;\n  --r-pill: 999px;\n\n  /* Elevation — soft, warm, low-key */\n  --shadow-xs: 0 1px 2px rgba(32,37,58,0.06);\n  --shadow-sm: 0 2px 6px rgba(32,37,58,0.08);\n  --shadow-md: 0 6px 18px rgba(32,37,58,0.10);\n  --shadow-lg: 0 18px 40px rgba(32,37,58,0.14);\n  --shadow-bronze: 0 6px 22px rgba(183, 149, 80, 0.28);\n\n  /* Motion */\n  --ease-out:   cubic-bezier(0.2, 0.7, 0.25, 1);\n  --ease-in:    cubic-bezier(0.55, 0, 0.85, 0.35);\n  --ease-inout: cubic-bezier(0.5, 0, 0.2, 1);\n  --dur-fast:   140ms;\n  --dur-base:   220ms;\n  --dur-slow:   420ms;\n}\n\n/* ---------------------------------------------------------------\n   SEMANTIC TYPE STYLES\n   --------------------------------------------------------------- */\n\n.ns-eyebrow {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-medium);\n  font-size: var(--fs-xs);\n  letter-spacing: var(--ls-wider);\n  text-transform: uppercase;\n  color: var(--fg-accent);\n}\n\n.ns-display {\n  font-family: var(--font-display);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-5xl);\n  line-height: var(--lh-tight);\n  letter-spacing: var(--ls-wide);\n  text-transform: uppercase;\n  color: var(--fg-primary);\n}\n\n.ns-h1 {\n  font-family: var(--font-heading);\n  font-weight: var(--fw-medium);\n  font-size: var(--fs-4xl);\n  line-height: var(--lh-tight);\n  letter-spacing: var(--ls-tight);\n  color: var(--fg-primary);\n}\n.ns-h2 {\n  font-family: var(--font-heading);\n  font-weight: var(--fw-medium);\n  font-size: var(--fs-3xl);\n  line-height: var(--lh-snug);\n  color: var(--fg-primary);\n}\n.ns-h3 {\n  font-family: var(--font-heading);\n  font-weight: var(--fw-medium);\n  font-size: var(--fs-2xl);\n  line-height: var(--lh-snug);\n  color: var(--fg-primary);\n}\n.ns-h4 {\n  font-family: var(--font-heading);\n  font-weight: var(--fw-semibold);\n  font-size: var(--fs-xl);\n  line-height: var(--lh-snug);\n  color: var(--fg-primary);\n}\n\n.ns-subheader {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-medium);\n  font-size: var(--fs-sm);\n  letter-spacing: var(--ls-widest);\n  text-transform: uppercase;\n  color: var(--fg-secondary);\n}\n\n.ns-body {\n  font-family: var(--font-body);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-md);\n  line-height: var(--lh-relaxed);\n  color: var(--fg-primary);\n}\n.ns-body-sm {\n  font-family: var(--font-body);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-base);\n  line-height: var(--lh-relaxed);\n  color: var(--fg-secondary);\n}\n\n.ns-ui {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-medium);\n  font-size: var(--fs-sm);\n  letter-spacing: 0.04em;\n  color: var(--fg-primary);\n}\n\n.ns-button-label {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-semibold);\n  font-size: var(--fs-sm);\n  letter-spacing: var(--ls-wider);\n  text-transform: uppercase;\n}\n\n.ns-quote {\n  font-family: var(--font-heading);\n  font-style: italic;\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-xl);\n  line-height: var(--lh-snug);\n  color: var(--fg-primary);\n}\n\n/* ---------------------------------------------------------------\n   ELEMENT DEFAULTS (opt-in via .ns-doc on a wrapper)\n   --------------------------------------------------------------- */\n.ns-doc {\n  background: var(--bg-primary);\n  color: var(--fg-primary);\n  font-family: var(--font-body);\n  font-size: var(--fs-md);\n  line-height: var(--lh-relaxed);\n  -webkit-font-smoothing: antialiased;\n}\n.ns-doc h1 { font: var(--fw-medium) var(--fs-4xl)/var(--lh-tight) var(--font-heading); letter-spacing: var(--ls-tight); margin: 0 0 var(--sp-4); }\n.ns-doc h2 { font: var(--fw-medium) var(--fs-3xl)/var(--lh-snug) var(--font-heading); margin: var(--sp-12) 0 var(--sp-4); }\n.ns-doc h3 { font: var(--fw-medium) var(--fs-2xl)/var(--lh-snug) var(--font-heading); margin: var(--sp-8) 0 var(--sp-3); }\n.ns-doc h4 { font: var(--fw-semibold) var(--fs-xl)/var(--lh-snug) var(--font-heading); margin: var(--sp-6) 0 var(--sp-2); }\n.ns-doc p  { margin: 0 0 var(--sp-4); max-width: 64ch; text-wrap: pretty; }\n.ns-doc a  { color: var(--ns-bronze); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; transition: color var(--dur-fast) var(--ease-out); }\n.ns-doc a:hover { color: var(--ns-bronze-dark); }\n<\u002Fstyle>\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"anonymous\">\n<style>/* vietnamese */\n@font-face {\n  font-family: 'Work Sans';\n  font-style: normal;\n  font-weight: 300;\n  font-display: swap;\n  src: url(\"97947fcd-c09d-47f1-8c15-e8dd978d47a3\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Work Sans';\n  font-style: normal;\n  font-weight: 300;\n  font-display: swap;\n  src: url(\"3e176297-12c0-4c0b-8820-6249cce50cda\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Work Sans';\n  font-style: normal;\n  font-weight: 300;\n  font-display: swap;\n  src: url(\"d56bb045-0594-4357-9cd5-6149b360a4c1\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Work Sans';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"97947fcd-c09d-47f1-8c15-e8dd978d47a3\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-f lex-direction:column; padding:clamp(24px,3vw,48px) clamp(22px,6vw,90px) clamp(120px,14vh,160px); }\n  .ns-inner { max-width:780px; width:100%; margin:auto; }\n\n  .ns-eyebrow { font-family:var(--font-label); font-size:13px; font-weight:600; letter-spacing:.22em;\n    text-transform:uppercase; color:var(--ns-bronze-ink); }\n  .ns-h { margin:18px 0 0; font-family:var(--font-display); font-weight:400; line-height:1.04; letter-spacing:.005em;\n    font-size:clamp(34px,5.4vw,66px); max-width:22ch; }\n  .ns-p { margin:22px 0 0; max-width:52ch; font-size:clamp(19px,1.8vw,24px); color:var(--text-body); }\n  .ns-p-sm { margin:16px 0 0; max-width:56ch; font-size:clamp(17px,1.5vw,20px); color:var(--text-muted); }\n\n  .ns-do { margin:clamp(24px,3vw,36px) 0 0; padding:clamp(20px,2.4vw,28px) clamp(20px,2.6vw,30px);\n    background:#F6E7D7; border-left:3px solid #B79550; border-radius:3px; }\n  .ns-do-t { font-family:var(--font-label); font-size:13px; font-weight:600; letter-spacing:.2em;\n    text-transform:uppercase; color:var(--ns-bronze-ink); }\n  .ns-do-p { margin:12px 0 0; max-width:52ch; font-size:clamp(18px,1.6vw,21px); font-weight:500; color:#20253A; }\n\n  .ns-list { margin:clamp(20px,2.6vw,30px) 0 0; border-top:1px solid var(--hair); }\n  .ns-li { display:grid; grid-template-columns:26px 1fr; gap:14px; padding:13px 0; border-bottom:1px solid var(--hair);\n    font-size:clamp(17px,1.5vw,20px); line-height:1.55; color:var(--text-body); }\n\n  /* the controls sit still at the bottom, always in the same place */\n  .ns-bar { position:fixed; left:0; right:0; bottom:0; z-index:40; background:rgba(245,244,225,.96);\n    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-top:1px solid var(--hair); }\n  .ns-bar-in { max-width:1180px; margin:0 auto; padding:14px clamp(16px,4vw,34px);\n    display:flex; align-items:center; gap:clamp(10px,2vw,20px); }\n  .ns-nav { display:inline-flex; align-items:center; justify-content:center; gap:9px; min-height:62px; min-width:62px;\n    padding:0 clamp(18px,2.4vw,30px); border:none; border-radius:5px; background:#B79550; color:#20253A; cursor:pointer;\n    font-family:var(--font-sans); font-size:18px; font-weight:600; text-decoration:none; white-space:nowrap;\n    transition:background .2s cubic-bezier(.2,.7,.25,1), opacity .2s ease; }\n  .ns-nav:hover { background:#97793c; color:#20253A; }\n  .ns-nav.ns-quiet { background:none; border:2px solid #20253A; }\n  .ns-nav.ns-quiet:hover { background:#20253A; color:#F5F4E1; }\n  .ns-nav:disabled { opacity:.35; cursor:default; background:none; border:2px solid rgba(32,37,58,.4); }\n  .ns-count { font-family:var(--font-label); font-size:14px; font-weight:600; letter-spacing:.12em;\n    text-transform:uppercase; color:var(--text-muted); white-space:nowrap; }\n  .ns-meter { flex:1; min-width:40px; height:6px; background:rgba(32,37,58,.14); border-radius:3px; overflow:hidden; }\n  .ns-meter span { display:block; height:100%; background:#B79550; width:0%; transition:width .6s cubic-bezier(.2,.7,.25,1); }\n\n  .ns-top { position:fixed; left:0; right:0; top:0; z-index:40; background:rgba(245,244,225,.96);\n    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--hair); }\n\n  @media (max-width: 760px) {\n    .ns-count { display:none; }\n    .ns-nav { padding:0 16px; font-size:17px; }\n  }\n  @media (prefers-reduced-motion: reduce) { .ns-track { transition:none; } }\n<\u002Fstyle>\n<script src=\"a700b075-5ea3-4059-a126-b57e9ff33045\" data-variant=\"b\" data-no-href=\"rules.html\" data-leaf=\"assets/brand/nav-mark-fanleaf-gold.png\"><\u002Fscript>\n<\u002Fhelmet>\n\n<div style=\"position:fixed; inset:0; background:#F5F4E1; display:flex; flex-direction:column\">\n\n  <div class=\"ns-top\">\n    <div style=\"max-width:1180px; margin:0 auto; padding:0 clamp(16px,4vw,34px); height:66px; display:flex; align-items:center; justify-content:space-between; gap:16px\">\n      <a href=\"index.html#doors\" style=\"display:flex; align-items:center; gap:11px; text-decoration:none\">\n        <span style=\"font-family:var(--font-label); font-size:11.5px; font-weight:600; letter-spacing:.2em; text-transform:uppercase; color:#20253A\">Natural State Medicinals<\u002Fspan>\n      <\u002Fa>\n      <a class=\"ns-nav\" href=\"paperwork.html\" style=\"min-height:46px; font-size:16px; padding:0 20px\">Get the paperwork<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position:absolute; left:0; right:0; top:66px; bottom:0; overflow:hidden\">\n    <div class=\"ns-track\" id=\"ns-track\">\n\n      <section class=\"ns-panel\" style=\"background:#F5F4E1\">\n        <div class=\"ns-inner\">\n          <span class=\"ns-eyebrow\">Arkansas, 2016<\u002Fspan>\n          <h1 class=\"ns-h\">People voted, and now there is a card<\u002Fh1>\n          <p class=\"ns-p\">It is your name on a state registry, and you reach it through an account on the portal the Department of Health runs. You pull it up on your phone at the counter, or print it if you would rather hold paper. It does not come from a store, and it does not come from us.<\u002Fp>\n          <p class=\"ns-p\">With it, you can walk into a licensed dispensary and buy medicine. Without it, you cannot. That is the whole reason this page exists.<\u002Fp>\n          <p class=\"ns-p-sm\">It takes about two weeks and costs fifty dollars, plus a doctor visit. When you are approved, the card lives in your account on the state portal, so you can carry it on your phone or print it. Ten short pages from here to the counter. Use the arrows at the bottom, or the arrow keys on your keyboard.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section class=\"ns-panel\" style=\"background:#F5F4E1\">\n        <div class=\"ns-inner\">\n          <span class=\"ns-eyebrow\">Page two, who it is for<\u002Fspan>\n          <h2 class=\"ns-h\">First, is it you?<\u002Fh2>\n          <p class=\"ns-p\">Three things have to be true before any of the rest matters. They are not hard, but the state does not bend on them.<\u002Fp>\n          <div class=\"ns-list\">\n            <div class=\"ns-li\"><span style=\"color:var(--ns-bronze-ink)\">1<\u002Fspan><span>You live in Arkansas, and your license or state ID says so.<\u002Fspan><\u002Fdiv>\n            <div class=\"ns-li\"><span style=\"color:var(--ns-bronze-ink)\">2<\u002Fspan><span>You can get in to see an Arkansas medical doctor, an M.D. or a D.O.<\u002Fspan><\u002Fdiv>\n            <div class=\"ns-li\"><span style=\"color:var(--ns-bronze-ink)\">3<\u002Fspan><span>You are not in the military or the National Guard. Federal law says no, and nobody in Arkansas can waive that away.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <p class=\"ns-p-sm\">A patient under eighteen can hold a card, but a parent or legal guardian has to sign on as the caregiver and do the buying.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section class=\"ns-panel\" style=\"background:#20253A\">\n        <div class=\"ns-inner\">\n          <span class=\"ns-eyebrow\" style=\"color:rgba(183,149,80,.95)\">Page three, the list<\u002Fspan>\n          <h2 class=\"ns-h\" style=\"color:var(--ns-arctic)\">Eighteen qualifying conditions<\u002Fh2>\n          <p class=\"ns-p\" style=\"color:rgba(245,244,225,.9)\">Arkansas approves the card for these eighteen. Your doctor names the one that fits you, exactly as it is written here.<\u002Fp>\n          <div class=\"ns-list\" style=\"border-top-color:rgba(245,244,225,.22); columns:2; column-gap:44px\">\n            <sc-for list=\"{{ conditions }}\" as=\"c\" hint-placeholder-count=\"18\">\n              <div class=\"ns-li\" style=\"border-bottom-color:rgba(245,244,225,.16); break-inside:avoid; color:rgba(245,244,225,.92)\">\n                <span style=\"color:rgba(183,149,80,.95); font-family:var(--font-label); font-size:13px; padding-top:4px\">{{ c.num }}<\u002Fspan>\n                <span>{{ c.name }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <p class=\"ns-p-sm\" style=\"color:rgba(245,244,225,.72)\">Worry by itself is not on the list. Feeling low by itself is not on the list. People find that out after they have paid, which is a rotten way to find anything out.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section class=\"ns-panel\" style=\"background:#F5F4E1\">\n        <div class=\"ns-inner\">\n          <span class=\"ns-eyebrow\">Page four, step one of five<\u002Fspan>\n          <h2 class=\"ns-h\">Start with what is in your wallet<\u002Fh2>\n          <p class=\"ns-p\">The state wants proof you live here. Your Arkansas driver license or state ID is that proof, and the address on it has to be the address where you sleep.<\u002Fp>\n          <div class=\"ns-do\">\n            <span class=\"ns-do-t\">Do this<\u002Fspan>\n            <p class=\"ns-do-p\">Make a photocopy of the front of your ID, on a full sheet of paper. That copy goes in with everything else.<\u002Fp>\n          <\u002Fdiv>\n          <p class=\"ns-p-sm\">If you moved and the address is old, go fix that first, before anything else on this page. It is the most common reason applications come back. Stand in that line once now instead of twice later. And a card from another state will not work here, so if you live elsewhere, page nine is for you.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section class=\"ns-panel\" style=\"background:#F5F4E1\">\n        <div class=\"ns-inner\">\n          <span class=\"ns-eyebrow\">Page five, step two of five<\u002Fspan>\n          <h2 class=\"ns-h\">Then a doctor signs one page<\u002Fh2>\n          <p class=\"ns-p\">A doctor looks you over and signs a single page that names your condition. The state calls it a written certification. A video visit counts.<\u002Fp>\n          <div class=\"ns-do\">\n            <span class=\"ns-do-t\">Do this<\u002Fspan>\n            <p class=\"ns-do-p\">Print the patient application and carry the whole thing to the visit. The doctor's page is already inside it.<\u002Fp>\n          <\u002Fdiv>\n          <p class=\"ns-p-sm\">That signature goes stale in thirty days. If it reaches the state on day thirty one, the page is worth nothing and you pay for another visit. Upload it the same week you get it.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section class=\"ns-panel\" style=\"background:#F6E7D7\">\n        <div class=\"ns-inner\">\n          <span class=\"ns-eyebrow\">Page six, step three of five<\u002Fspan>\n          <h2 class=\"ns-h\">Four things go up on the portal<\u002Fh2>\n          <p class=\"ns-p\">You do this on the state's website, at mmj.adh.arkansas.gov. It is the way the state wants it, and it is faster. All four go together.<\u002Fp>\n          <div class=\"ns-list\">\n            <div class=\"ns-li\"><span style=\"color:var(--ns-bronze-ink)\">·<\u002Fspan><span>The application, filled out.<\u002Fspan><\u002Fdiv>\n            <div class=\"ns-li\"><span style=\"color:var(--ns-bronze-ink)\">·<\u002Fspan><span>The page your doctor signed.<\u002Fspan><\u002Fdiv>\n            <div class=\"ns-li\"><span style=\"color:var(--ns-bronze-ink)\">·<\u002Fspan><span>The photocopy of your ID.<\u002Fspan><\u002Fdiv>\n            <div class=\"ns-li\"><span style=\"color:var(--ns-bronze-ink)\">·<\u002Fspan><span>Fifty dollars, which you do not get back, ever, for any reason.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <p class=\"ns-p-sm\">If one thing is missing, it comes back. They do not hold it and wait for you to notice. Before you hit send, read your own name out loud against your ID, letter for letter, and do the same with your birthday.<\u002Fp>\n          <p class=\"ns-p-sm\">You make an account, upload the pages, and pay the fifty dollars with a card. The portal also shows you where your application stands, which is something a mailed envelope will never do.<\u002Fp>\n          <div style=\"margin:22px 0 0; display:flex; gap:14px; flex-wrap:wrap\">\n            <a class=\"ns-nav\" href=\"https://mmj.adh.arkansas.gov/?action=registration\" target=\"_blank\" rel=\"noopener\" style=\"min-height:56px; font-size:17px\">Open the state portal<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section class=\"ns-panel\" style=\"background:#F5F4E1\">\n        <div class=\"ns-inner\">\n          <span class=\"ns-eyebrow\">Page seven, step four of five<\u002Fspan>\n          <h2 class=\"ns-h\">Now you wait, and then you check the portal<\u002Fh2>\n          <p class=\"ns-p\">The state gets up to fourteen days. When they approve you, your card shows up in your account on the state portal, and you can use it from there.<\u002Fp>\n          <div class=\"ns-do\">\n            <span class=\"ns-do-t\">Do this<\u002Fspan>\n            <p class=\"ns-do-p\">Watch for the approval, then sign in to the portal. You can pull your card up on your phone, or print it and carry the paper.<\u002Fp>\n          <\u002Fdiv>\n          <p class=\"ns-p-sm\">Plenty of patients never carry anything but the version on their phone. A printed copy in the glove box is not a bad idea either, for the day the signal is poor.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section class=\"ns-panel\" style=\"background:#F5F4E1\">\n        <div class=\"ns-inner\">\n          <span class=\"ns-eyebrow\">Page eight, step five of five<\u002Fspan>\n          <h2 class=\"ns-h\">Then you go, and you ask questions<\u002Fh2>\n          <p class=\"ns-p\">Bring your card, on your phone or on paper, and bring your ID. The person behind the counter has done this a thousand times and would rather you ask than guess.<\u002Fp>\n          <div class=\"ns-list\">\n            <div class=\"ns-li\"><span style=\"color:var(--ns-bronze-ink)\">·<\u002Fspan><span>You may buy two and a half ounces every fourteen days.<\u002Fspan><\u002Fdiv>\n            <div class=\"ns-li\"><span style=\"color:var(--ns-bronze-ink)\">·<\u002Fspan><span>The state counts it across every dispensary, so you cannot stretch it by driving to the next town.<\u002Fspan><\u002Fdiv>\n            <div class=\"ns-li\"><span style=\"color:var(--ns-bronze-ink)\">·<\u002Fspan><span>Ask what the register says your count is before you decide what to buy.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <p class=\"ns-p-sm\">Ask for Natural State by name if you want ours. What a store keeps on the shelf changes week to week, and asking is how they learn what to order.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section class=\"ns-panel\" style=\"background:#EFD7C5\">\n        <div class=\"ns-inner\">\n          <span class=\"ns-eyebrow\">Page nine, the honest part<\u002Fspan>\n          <h2 class=\"ns-h\">What it costs, and what it will not do<\u002Fh2>\n          <p class=\"ns-p\">The state fee is fifty dollars a year. The doctor visit is separate, and most Arkansas clinics land between a hundred and fifty and two hundred fifty. Insurance does not cover either one yet, so plan for it the way you would a dental visit. Ask what a clinic charges when you call, since the price varies.<\u002Fp>\n          <div class=\"ns-list\">\n            <div class=\"ns-li\"><span style=\"color:var(--ns-bronze-ink)\">·<\u002Fspan><span>The card lasts one year, does not renew itself, and nobody calls to remind you. Start again sixty days early, with a brand new page from a doctor.<\u002Fspan><\u002Fdiv>\n            <div class=\"ns-li\"><span style=\"color:var(--ns-bronze-ink)\">·<\u002Fspan><span>You cannot grow a plant at home. Not one, not in a closet. That is still a felony here.<\u002Fspan><\u002Fdiv>\n            <div class=\"ns-li\"><span style=\"color:var(--ns-bronze-ink)\">·<\u002Fspan><span>It does not cross a state line, even into a state that allows it. The road between belongs to the federal government.<\u002Fspan><\u002Fdiv>\n            <div class=\"ns-li\"><span style=\"color:var(--ns-bronze-ink)\">·<\u002Fspan><span>It does not cover driving impaired, and it does not cover anybody but you. Handing your medicine to a friend can cost you the card.<\u002Fspan><\u002Fdiv>\n            <div class=\"ns-li\"><span style=\"color:var(--ns-bronze-ink)\">·<\u002Fspan><span>Cannot get to a store? One person can be named your caregiver. They apply too, pass a background check, and pay thirty four dollars for it.<\u002Fspan><\u002Fdiv>\n            <div class=\"ns-li\"><span style=\"color:var(--ns-bronze-ink)\">·<\u002Fspan><span>Hold a card from another state? Arkansas will sell you a short visitor card if your condition is on the Arkansas list too.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section class=\"ns-panel\" style=\"background:#F5F4E1\">\n        <div class=\"ns-inner\">\n          <span class=\"ns-eyebrow\">The end of it<\u002Fspan>\n          <h2 class=\"ns-h\">That is the whole road<\u002Fh2>\n          <p class=\"ns-p\">Nobody memorizes this. Take the paperwork with you and let the page do the remembering.<\u002Fp>\n          <div style=\"margin:clamp(26px,3.4vw,42px) 0 0; display:flex; gap:14px; flex-wrap:wrap\">\n            <a class=\"ns-nav\" href=\"paperwork.html\">Get the paperwork<\u002Fa>\n            <a class=\"ns-nav ns-quiet\" href=\"allotment.html\">Check your allotment<\u002Fa>\n          <\u002Fdiv>\n          <p class=\"ns-p-sm\">If something here does not match what the state tells you, believe the state. Their page is at healthy.arkansas.gov, and they are the only ones who can see your application.<\u002Fp>\n          <p class=\"ns-p-sm\" style=\"font-size:15px; margin-top:26px\">{{ sourceNote }}<\u002Fp>\n          <p class=\"ns-p-sm\" style=\"font-size:15px\">{{ compliance }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"ns-bar\">\n    <div class=\"ns-bar-in\">\n      <button class=\"ns-nav ns-quiet\" type=\"button\" sc-camel-on-click=\"{{ onBack }}\" disabled=\"{{ atFirst }}\" aria-label=\"Previous page\">← Back<\u002Fbutton>\n      <span class=\"ns-count\">{{ counter }}<\u002Fspan>\n      <span class=\"ns-meter\" aria-hidden=\"true\"><span id=\"ns-meter-fill\"><\u002Fspan><\u002Fspan>\n      <button class=\"ns-nav\" type=\"button\" sc-camel-on-click=\"{{ onNext }}\" disabled=\"{{ atLast }}\" aria-label=\"Next page\">{{ nextLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;federalPosture&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Compliance&quot;}}\">\nconst TOTAL = 10;\n\nclass Component extends DCLogic {\n  state = { i: 0 };\n\n  componentDidMount() {\n    this._onKey = (e) => {\n      if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); this.move(1); }\n      if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); this.move(-1); }\n      if (e.key === 'Home') { e.preventDefault(); this.to(0); }\n      if (e.key === 'End') { e.preventDefault(); this.to(TOTAL - 1); }\n    };\n    addEventListener('keydown', this._onKey);\n\n    // a swipe reads as a page turn, which is what people already expect\n    let x0 = null, y0 = null;\n    this._down = (e) => { x0 = e.clientX; y0 = e.clientY; };\n    this._up = (e) => {\n      if (x0 === null) return;\n      const dx = e.clientX - x0, dy = e.clientY - y0;\n      x0 = null;\n      if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.4) this.move(dx < 0 ? 1 : -1);\n    };\n    addEventListener('pointerdown', this._down, { passive: true });\n    addEventListener('pointerup', this._up, { passive: true });\n\n    this.paint();\n  }\n\n  componentDidUpdate() { this.paint(); }\n\n  componentWillUnmount() {\n    removeEventListener('keydown', this._onKey);\n    removeEventListener('pointerdown', this._down);\n    removeEventListener('pointerup', this._up);\n  }\n\n  paint() {\n    const track = document.getElementById('ns-track');\n    if (track) track.style.transform = 'translate3d(' + (-this.state.i * 100) + '%,0,0)';\n    const fill = document.getElementById('ns-meter-fill');\n    if (fill) fill.style.width = ((this.state.i + 1) / TOTAL * 100).toFixed(1) + '%';\n    const panels = document.querySelectorAll('.ns-panel');\n    panels.forEach((p, n) => {\n      p.setAttribute('aria-hidden', n === this.state.i ? 'false' : 'true');\n      p.scrollTop = 0;\n    });\n  }\n\n  to(i) { this.setState({ i: Math.max(0, Math.min(TOTAL - 1, i)) }); }\n  move(d) { this.to(this.state.i + d); }\n\n  renderVals() {\n    const i = this.state.i;\n    return {\n      counter: 'Page ' + (i + 1) + ' of ' + TOTAL,\n      atFirst: i === 0 || undefined,\n      atLast: i === TOTAL - 1 || undefined,\n      nextLabel: i === 0 ? 'Begin \\u2192' : 'Next \\u2192',\n      onNext: () => this.move(1),\n      onBack: () => this.move(-1),\n      conditions: [\n        'Cancer', 'Glaucoma', 'HIV or AIDS', 'Hepatitis C', 'ALS, Lou Gehrig\\u2019s disease',\n        'Tourette\\u2019s syndrome', 'Crohn\\u2019s disease', 'Ulcerative colitis', 'Post traumatic stress disorder',\n        'Severe arthritis', 'Fibromyalgia', 'Alzheimer\\u2019s disease', 'Seizures, including epilepsy',\n        'Severe and persistent muscle spasms, including multiple sclerosis', 'Peripheral neuropathy',\n        'Intractable pain, unrelieved for six months or more', 'Severe nausea', 'Cachexia, or wasting syndrome'\n      ].map((name, n) => ({ name, num: String(n + 1).padStart(2, '0') })),\n      sourceNote: 'Steps, fees, and conditions on this page follow the Arkansas Medical Marijuana Amendment of 2016 and the Arkansas Department of Health rules, current as of August 2026. Rules change.',\n      compliance: this.props.federalPosture\n        ? 'For adults 21 and over. Keep out of reach of children. This product is not approved by the FDA to treat, cure, or prevent any disease. Marijuana use during pregnancy or breastfeeding poses potential harms. This site is education, not medical advice.'\n        : 'For use by qualifying patients only. Keep out of reach of children. This product is not approved by the FDA to treat, cure, or prevent any disease. Marijuana use during pregnancy or breastfeeding poses potential harms. This site is education, not medical advice.'\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
