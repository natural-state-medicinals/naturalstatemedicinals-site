  --bg-secondary:   var(--ns-cream);\n  --bg-tertiary:    var(--ns-haze);\n  --bg-inverse:     var(--ns-midnight);\n  --bg-elevated:    #ffffff;\n\n  --fg-primary:     var(--ns-midnight);\n  --fg-secondary:   var(--ns-midnight-70);\n  --fg-tertiary:    var(--ns-midnight-50);\n  --fg-inverse:     var(--ns-arctic);\n  --fg-accent:      var(--ns-bronze);\n\n  --border-hairline: rgba(32, 37, 58, 0.12);\n  --border-default:  rgba(32, 37, 58, 0.22);\n  --border-strong:   var(--ns-midnight);\n  --border-bronze:   var(--ns-bronze);\n\n  /* ===========================================================\n     TYPOGRAPHY — base families\n     ===========================================================\n     - display: ornate slab serif used for arched marks, big numbers\n     - heading: classical serif for H1–H3\n     - sans:    geometric sans for eyebrows, labels, UI\n     - body:    serif for long-form copy\n  */\n  --font-display:         'Burford', 'Playfair Display', Georgia, serif;\n  --font-display-outline: 'Burford Outline', 'Burford', Georgia, serif;\n  --font-display-line:    'Burford Line', 'Burford', Georgia, serif;\n  --font-display-rustic:  'Burford Rustic', 'Burford', Georgia, serif;\n  --font-heading:         'Esther', 'Cormorant Garamond', Georgia, serif;\n  --font-sans:            'Caligor Sans', 'Outfit', 'Futura', system-ui, sans-serif;\n  --font-sans-edge:       'Caligor Sans Edge', 'Caligor Sans', system-ui, sans-serif;\n  --font-serif-sans:      'Caligor', 'Outfit', system-ui, sans-serif;\n  --font-body:            'Esther', 'Cormorant Garamond', Georgia, serif;\n  --font-mono:            ui-monospace, 'SF Mono', Menlo, monospace;\n\n  /* Weight scale */\n  --fw-light:    300;\n  --fw-regular:  400;\n  --fw-medium:   500;\n  --fw-semibold: 600;\n  --fw-bold:     700;\n\n  /* Type scale (modular, ratio ~1.25) */\n  --fs-xs:    12px;\n  --fs-sm:    14px;\n  --fs-base:  16px;\n  --fs-md:    18px;\n  --fs-lg:    22px;\n  --fs-xl:    28px;\n  --fs-2xl:   36px;\n  --fs-3xl:   48px;\n  --fs-4xl:   64px;\n  --fs-5xl:   88px;\n  --fs-6xl:   120px;\n\n  /* Line heights */\n  --lh-tight:   1.05;\n  --lh-snug:    1.2;\n  --lh-base:    1.5;\n  --lh-relaxed: 1.65;\n\n  /* Letter spacing — eyebrows + display caps want generous tracking */\n  --ls-tight:   -0.01em;\n  --ls-normal:  0;\n  --ls-wide:    0.08em;\n  --ls-wider:   0.18em;   /* eyebrow / label all-caps */\n  --ls-widest:  0.32em;   /* display arched headers */\n\n  /* ===========================================================\n     SPACING — 4px base\n     =========================================================== */\n  --sp-0:  0;\n  --sp-1:  4px;\n  --sp-2:  8px;\n  --sp-3:  12px;\n  --sp-4:  16px;\n  --sp-5:  20px;\n  --sp-6:  24px;\n  --sp-8:  32px;\n  --sp-10: 40px;\n  --sp-12: 48px;\n  --sp-16: 64px;\n  --sp-20: 80px;\n  --sp-24: 96px;\n  --sp-32: 128px;\n\n  /* Radii — restrained. Brand artwork is square-cornered slab-serif. */\n  --r-none: 0;\n  --r-xs:   2px;\n  --r-sm:   4px;\n  --r-md:   6px;\n  --r-lg:   10px;\n  --r-pill: 999px;\n\n  /* Elevation — soft, warm, low-key */\n  --shadow-xs: 0 1px 2px rgba(32,37,58,0.06);\n  --shadow-sm: 0 2px 6px rgba(32,37,58,0.08);\n  --shadow-md: 0 6px 18px rgba(32,37,58,0.10);\n  --shadow-lg: 0 18px 40px rgba(32,37,58,0.14);\n  --shadow-bronze: 0 6px 22px rgba(183, 149, 80, 0.28);\n\n  /* Motion */\n  --ease-out:   cubic-bezier(0.2, 0.7, 0.25, 1);\n  --ease-in:    cubic-bezier(0.55, 0, 0.85, 0.35);\n  --ease-inout: cubic-bezier(0.5, 0, 0.2, 1);\n  --dur-fast:   140ms;\n  --dur-base:   220ms;\n  --dur-slow:   420ms;\n}\n\n/* ---------------------------------------------------------------\n   SEMANTIC TYPE STYLES\n   --------------------------------------------------------------- */\n\n.ns-eyebrow {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-medium);\n  font-size: var(--fs-xs);\n  letter-spacing: var(--ls-wider);\n  text-transform: uppercase;\n  color: var(--fg-accent);\n}\n\n.ns-display {\n  font-family: var(--font-display);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-5xl);\n  line-height: var(--lh-tight);\n  letter-spacing: var(--ls-wide);\n  text-transform: uppercase;\n  color: var(--fg-primary);\n}\n\n.ns-h1 {\n  font-family: var(--font-heading);\n  font-weight: var(--fw-medium);\n  font-size: var(--fs-4xl);\n  line-height: var(--lh-tight);\n  letter-spacing: var(--ls-tight);\n  color: var(--fg-primary);\n}\n.ns-h2 {\n  font-family: var(--font-heading);\n  font-weight: var(--fw-medium);\n  font-size: var(--fs-3xl);\n  line-height: var(--lh-snug);\n  color: var(--fg-primary);\n}\n.ns-h3 {\n  font-family: var(--font-heading);\n  font-weight: var(--fw-medium);\n  font-size: var(--fs-2xl);\n  line-height: var(--lh-snug);\n  color: var(--fg-primary);\n}\n.ns-h4 {\n  font-family: var(--font-heading);\n  font-weight: var(--fw-semibold);\n  font-size: var(--fs-xl);\n  line-height: var(--lh-snug);\n  color: var(--fg-primary);\n}\n\n.ns-subheader {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-medium);\n  font-size: var(--fs-sm);\n  letter-spacing: var(--ls-widest);\n  text-transform: uppercase;\n  color: var(--fg-secondary);\n}\n\n.ns-body {\n  font-family: var(--font-body);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-md);\n  line-height: var(--lh-relaxed);\n  color: var(--fg-primary);\n}\n.ns-body-sm {\n  font-family: var(--font-body);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-base);\n  line-height: var(--lh-relaxed);\n  color: var(--fg-secondary);\n}\n\n.ns-ui {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-medium);\n  font-size: var(--fs-sm);\n  letter-spacing: 0.04em;\n  color: var(--fg-primary);\n}\n\n.ns-button-label {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-semibold);\n  font-size: var(--fs-sm);\n  letter-spacing: var(--ls-wider);\n  text-transform: uppercase;\n}\n\n.ns-quote {\n  font-family: var(--font-heading);\n  font-style: italic;\n  font-weight: var(--fw-regular);\n  font-siz
